<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CloudPad</title>
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      margin: 0;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 16px 0;
      color: #333;
    }
    .status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
    }
    .status.connected {
      background: #e8f5e9;
      color: #2e7d32;
    }
    .status.disconnected {
      background: #ffebee;
      color: #c62828;
    }
    .info {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }
    a {
      color: #1976d2;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>🎮 CloudPad</h1>
  <div id="status" class="status disconnected">
    <strong>Status:</strong> Checking connection...
  </div>
  <div class="info">
    <p>Make sure CloudPad app is running on your computer.</p>
    <p><a href="#" id="help">Need help?</a></p>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
