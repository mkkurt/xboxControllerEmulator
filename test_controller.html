<!DOCTYPE html>
<html>
<head>
    <title>Xbox Controller Emulator Test</title>
    <style>
        body { font-family: sans-serif; background: #222; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .controller { position: relative; width: 600px; height: 400px; background: #333; border-radius: 20px; border: 2px solid #555; }
        .stick { position: absolute; width: 100px; height: 100px; background: #444; border-radius: 50%; border: 2px solid #666; }
        .stick-dot { position: absolute; width: 20px; height: 20px; background: #0f0; border-radius: 50%; top: 40px; left: 40px; transition: all 0.05s linear; }
        #left-stick { top: 150px; left: 50px; }
        #right-stick { top: 200px; left: 350px; }
        .btn { position: absolute; width: 40px; height: 40px; background: #444; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .btn.pressed { background: #0f0; color: #000; }
        #btn-a { top: 200px; right: 50px; }
        #btn-b { top: 150px; right: 20px; }
        #btn-x { top: 150px; right: 80px; }
        #btn-y { top: 100px; right: 50px; }
        .trigger { position: absolute; width: 20px; height: 60px; background: #444; top: 20px; }
        .trigger-bar { width: 100%; background: #0f0; position: absolute; bottom: 0; height: 0%; }
        #trig-l { left: 50px; }
        #trig-r { right: 50px; }
        #status { margin-bottom: 20px; font-size: 1.2em; }
        #dpad { position: absolute; top: 200px; left: 200px; width: 80px; height: 80px; }
        .dpad-btn { position: absolute; background: #444; width: 25px; height: 25px; }
        .dpad-btn.pressed { background: #0f0; }
        #dp-u { top: 0; left: 27.5px; }
        #dp-d { bottom: 0; left: 27.5px; }
        #dp-l { top: 27.5px; left: 0; }
        #dp-r { top: 27.5px; right: 0; }
    </style>
</head>
<body>
    <div id="status">Connecting...</div>
    <div id="raw-data" style="font-family: monospace; font-size: 12px; color: #aaa; margin-bottom: 10px; height: 20px; overflow: hidden;">Waiting for data...</div>
    <div class="controller">
        <div class="trigger" id="trig-l"><div class="trigger-bar" id="tb-l"></div></div>
        <div class="trigger" id="trig-r"><div class="trigger-bar" id="tb-r"></div></div>
        
        <div class="stick" id="left-stick"><div class="stick-dot" id="ls-dot"></div></div>
        <div class="stick" id="right-stick"><div class="stick-dot" id="rs-dot"></div></div>
        
        <div id="dpad">
            <div class="dpad-btn" id="dp-u"></div>
            <div class="dpad-btn" id="dp-d"></div>
            <div class="dpad-btn" id="dp-l"></div>
            <div class="dpad-btn" id="dp-r"></div>
        </div>

        <div class="btn" id="btn-y">Y</div>
        <div class="btn" id="btn-x">X</div>
        <div class="btn" id="btn-b">B</div>
        <div class="btn" id="btn-a">A</div>
    </div>

    <script>
        const status = document.getElementById('status');
        const ws = new WebSocket('ws://127.0.0.1:8765');
        
        ws.onopen = () => { status.textContent = "Connected!"; status.style.color = "#0f0"; };
        ws.onclose = () => { status.textContent = "Disconnected"; status.style.color = "#f00"; };
        
        ws.onmessage = (event) => {
            // Show raw data
            document.getElementById('raw-data').textContent = event.data;

            const data = JSON.parse(event.data);
            
            // Axes
            const lx = data.axes[0];
            const ly = data.axes[1];
            document.getElementById('ls-dot').style.transform = `translate(${lx * 40}px, ${ly * 40}px)`;
            
            // Triggers
            document.getElementById('tb-l').style.height = `${data.buttons[6].value * 100}%`;
            document.getElementById('tb-r').style.height = `${data.buttons[7].value * 100}%`;
            
            // Buttons
            setBtn('btn-a', data.buttons[0].pressed);
            setBtn('btn-b', data.buttons[1].pressed);
            setBtn('btn-x', data.buttons[2].pressed);
            setBtn('btn-y', data.buttons[3].pressed);
            
            // D-Pad
            setBtn('dp-u', data.buttons[12].pressed);
            setBtn('dp-d', data.buttons[13].pressed);
            setBtn('dp-l', data.buttons[14].pressed);
            setBtn('dp-r', data.buttons[15].pressed);
        };
        
        function setBtn(id, pressed) {
            const el = document.getElementById(id);
            if (pressed) el.classList.add('pressed');
            else el.classList.remove('pressed');
        }
    </script>
</body>
</html>
